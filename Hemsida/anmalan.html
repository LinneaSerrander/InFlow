  <main id="main">
    <section class="section">
      <div class="container">
        <div class="section__header">
          <h1>Intresseanmälan</h1>
          <p>How to sign up for a course.</p>
        </div>
        <!-- Sent by js/forms.js to the Google Sheet (receiver: InFlow/google-script/formular.gs) -->
        <form class="form form--wide" data-form="anmalan"
              data-success="Tack för din intresseanmälan! Vi har tagit emot den och hör av oss så snart vi kan.">
          <!-- Spam trap: hidden from people, bots fill it in. Leave it empty. -->
          <div class="form__trap" aria-hidden="true">
            <label>Lämna tomt <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
          </div>

          <label>För- och efternamn på deltagare
            <input type="text" name="participant_name" autocomplete="off" required>
          </label>

          <!-- The groups are filled in from the "group:" lines in the course files in InFlow/Kurser/ (js/signup.js) -->
          <label>Grupp
            <select name="group" required data-course-groups>
              <option value="" disabled selected>Laddar grupper…</option>
            </select>
          </label>

          <div class="form__row">
            <label>För- och efternamn förälder 1
              <input type="text" name="parent1_name" autocomplete="name" required>
            </label>
            <label><span>För- och efternamn förälder 2 <span class="form__optional">(valfritt)</span></span>
              <input type="text" name="parent2_name" autocomplete="off">
            </label>
          </div>

          <div class="form__row">
            <label>Telefon förälder 1
              <input type="tel" name="parent1_phone" autocomplete="tel" required>
            </label>
            <label><span>Telefon förälder 2 <span class="form__optional">(valfritt)</span></span>
              <input type="tel" name="parent2_phone" autocomplete="off">
            </label>
          </div>

          <div class="form__row">
            <label>E-post förälder 1
              <input type="email" name="parent1_email" autocomplete="email" required>
            </label>
            <label><span>E-post förälder 2 <span class="form__optional">(valfritt)</span></span>
              <!-- Deliberately NOT type="email" / name "...email": Chrome ignores autocomplete="off"
                   on fields it recognises as email and would suggest the visitor's own address.
                   inputmode keeps the email keyboard on phones; pattern keeps the format check. -->
              <input type="text" name="parent2_epost" inputmode="email" autocomplete="off"
                     spellcheck="false" autocapitalize="off"
                     pattern="[^@\s]+@[^@\s]+\.[^@\s]+" title="Ange en giltig e-postadress, t.ex. namn@exempel.se">
            </label>
          </div>

          <label class="form__check">
            <input type="checkbox" name="photo_consent" value="ja">
            Jag godkänner att mitt barn får vara med på foto och video.
          </label>

          <label><span>Meddelande <span class="form__optional">(t.ex allergier)</span></span>
            <textarea name="message" rows="5"></textarea>
          </label>

          <label class="form__check">
            <input type="checkbox" name="privacy_consent" value="ja" required>
            <span>Jag har läst <a href="integritetspolicy.html" target="_blank">integritetspolicyn</a> och godkänner att InFlow sparar uppgifterna för att hantera anmälan.</span>
          </label>

          <button class="btn btn--primary" type="submit">Skicka intresseanmälan</button>
        </form>
      </div>
    </section>
