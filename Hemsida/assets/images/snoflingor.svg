<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#9fb3c8" stroke-linecap="round">
  <!-- One snowflake: six arms, each with two small branches -->
  <defs>
    <g id="arm">
      <line x1="0" y1="0" x2="0" y2="-40"/>
      <line x1="0" y1="-16" x2="-9" y2="-25"/>
      <line x1="0" y1="-16" x2="9" y2="-25"/>
      <line x1="0" y1="-28" x2="-6" y2="-34"/>
      <line x1="0" y1="-28" x2="6" y2="-34"/>
    </g>
    <g id="flake">
      <use href="#arm"/>
      <use href="#arm" transform="rotate(60)"/>
      <use href="#arm" transform="rotate(120)"/>
      <use href="#arm" transform="rotate(180)"/>
      <use href="#arm" transform="rotate(240)"/>
      <use href="#arm" transform="rotate(300)"/>
    </g>
  </defs>
  <use href="#flake" transform="translate(120 90) scale(1.25)" stroke-width="3"/>
  <use href="#flake" transform="translate(48 50) scale(0.6) rotate(15)" stroke-width="4.5"/>
  <use href="#flake" transform="translate(58 155) scale(0.45) rotate(30)" stroke-width="5.5"/>
  <use href="#flake" transform="translate(170 170) scale(0.35)" stroke-width="7"/>
</svg>
